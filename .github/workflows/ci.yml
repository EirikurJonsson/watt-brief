name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eirikurjonsson/watt-brief

# Every action is pinned to an exact commit (the tag is in the comment). Dependabot proposes
# updates, so a moved tag cannot change what runs here.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pyright src
      # Known-vulnerable pinned dependencies fail the build, not only the image scan.
      - run: uv export --frozen --no-dev --no-emit-project -o /tmp/requirements.txt && uv run pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
      - run: uv run pytest -q --cov=src/watt_brief --cov-report=term-missing:skip-covered --cov-fail-under=85

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not only the latest commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: [test, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build once locally and scan it before anything is published.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: watt-brief:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: watt-brief:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests prove the image builds and scans clean, but never publish it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: github.event_name == 'push'
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          # Build attestations: a signed statement of how the image was built, and its contents.
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

  # Off until the repository variable DEPLOY_ENABLED is set to "true" (see docs/deploy.md).
  deploy:
    needs: image
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-watt-brief
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cpa-intel

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_DIR,IMAGE,GIT_SHA
          script: |
            set -e
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            cd "${DEPLOY_DIR}"
            # Remember what is running now, so a bad release can be put back.
            previous=$(docker inspect --format '{{.Image}}' watt_brief 2>/dev/null || echo "")
            rollback() {
              echo "$1"
              docker logs --tail 30 watt_brief || true
              if [ -n "$previous" ]; then
                echo "rolling back to $previous"
                docker tag "$previous" "${IMAGE}:latest"
                docker compose up -d --no-deps --pull never watt_brief
              fi
              exit 1
            }
            docker compose pull watt_brief
            docker compose up -d watt_brief
            # Fail the deploy if the new container does not become healthy.
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' watt_brief 2>/dev/null || echo missing)
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || rollback "watt_brief is $status after deploy"
            # Healthy is not enough: it must be this commit, not an old image that was cached.
            running=$(docker exec watt_brief python -c "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz'))['version'])")
            [ "$running" = "$(echo "$GIT_SHA" | cut -c1-12)" ] || rollback "running version is $running, expected $GIT_SHA"
            docker image prune -f
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GIT_SHA: ${{ github.sha }}

      # The public URL, through Cloudflare: the same path a user takes. Set the repository
      # variable SMOKE_URL to switch it on. One real brief, a fraction of a cent.
      - name: Smoke test the live site
        if: vars.SMOKE_URL != ''
        run: scripts/smoke.sh "${{ vars.SMOKE_URL }}"
