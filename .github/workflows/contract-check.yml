name: contract-check

# Daily check of the live ENTSO-E API against what the parser expects. Needs the repository
# secret ENTSOE_API_TOKEN; without it the job skips itself.
on:
  schedule:
    - cron: "30 14 * * *" # after tomorrow's prices are published (about 13:00 Brussels)
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
      # Settings requires these; the check makes no model calls.
      LLM_API_KEY: unused
      LLM_BASE_URL: https://unused.invalid
      MODEL_PLANNER: unused
      MODEL_ANALYST: unused
      MODEL_CRITIC: unused
    steps:
      - name: Skip without a token
        if: env.ENTSOE_API_TOKEN == ''
        run: echo "ENTSOE_API_TOKEN is not set; nothing to check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ENTSOE_API_TOKEN != ''
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: env.ENTSOE_API_TOKEN != ''
      - run: uv sync
        if: env.ENTSOE_API_TOKEN != ''
      - run: uv run python scripts/contract_check.py
        if: env.ENTSOE_API_TOKEN != ''
